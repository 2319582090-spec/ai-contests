<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 赛事掘金</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafafa; --card-bg: #fff; --text: #1d1d1f;
      --text-secondary: #86868b; --accent: #0071e3;
      --border: #e5e5e7; --red: #ff3b30; --orange: #ff9500;
      --green: #34c759; --radius: 16px;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .hero { text-align: center; padding: 80px 24px 40px; }
    .hero h1 { font-size: clamp(36px, 6vw, 56px); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .subtitle { font-size: 18px; color: var(--text-secondary); font-weight: 400; }
    .update-date { font-size: 13px; color: var(--text-secondary); margin-top: 8px; opacity: 0.7; }
    .filters { display: flex; justify-content: center; gap: 8px; padding: 0 24px 40px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 20px; border: 1px solid var(--border); border-radius: 980px;
      background: var(--card-bg); font-size: 14px; color: var(--text); cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px; max-width: 1200px; margin: 0 auto; padding: 0 24px 80px;
    }
    .card {
      background: var(--card-bg); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow); cursor: pointer; transition: transform 0.25s, box-shadow 0.25s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
    .card-poster { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .card-body { padding: 20px; }
    .card-tags { display: flex; gap: 6px; margin-bottom: 10px; }
    .card-tag { font-size: 11px; padding: 3px 10px; border-radius: 980px; background: #f0f0f0; color: var(--text-secondary); font-weight: 500; }
    .card-tag.hot { background: #fff0f0; color: var(--red); }
    .card-name { font-size: 18px; font-weight: 600; margin-bottom: 12px; line-height: 1.3; }
    .card-meta { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--text-secondary); }
    .card-meta span { display: flex; align-items: center; gap: 6px; }
    .card-prize { color: var(--text); font-weight: 600; font-size: 16px; }
    .card-deadline.soon { color: var(--red); font-weight: 600; }
    .card-deadline.normal { color: var(--orange); }
    .card-deadline.safe { color: var(--green); }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px); z-index: 100; justify-content: center; align-items: center; padding: 24px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card-bg); border-radius: 20px; max-width: 560px; width: 100%;
      max-height: 90vh; overflow-y: auto; position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
      border: none; background: rgba(0,0,0,0.06); border-radius: 50%;
      font-size: 20px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; color: var(--text-secondary); z-index: 10;
    }
    .modal-poster { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 20px 20px 0 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .modal-title { font-size: 24px; font-weight: 700; padding: 24px 24px 8px; }
    .modal-desc { padding: 0 24px 20px; color: var(--text-secondary); font-size: 15px; line-height: 1.6; }
    .modal-info { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 24px 24px; }
    .modal-info-item { display: flex; flex-direction: column; gap: 2px; }
    .modal-info-item .label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
    .modal-info-item .value { font-size: 15px; font-weight: 600; }
    .modal-btn {
      display: block; margin: 0 24px 24px; padding: 14px; background: var(--accent);
      color: #fff; text-align: center; border-radius: 12px; text-decoration: none;
      font-size: 16px; font-weight: 600; transition: background 0.2s;
    }
    .modal-btn:hover { background: #0077ed; }
    .footer {
      text-align: center; padding: 40px 24px; color: var(--text-secondary);
      font-size: 13px; border-top: 1px solid var(--border);
    }
    .footer-email { font-size: 12px; margin-top: 6px; opacity: 0.6; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 80px 24px; color: var(--text-secondary); }
    .empty h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
    @media (max-width: 700px) {
      .hero { padding: 60px 20px 32px; }
      .grid { grid-template-columns: 1fr; padding: 0 16px 60px; }
      .filters { padding: 0 16px 32px; }
      .modal { border-radius: 16px; }
      .modal-info { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>AI 赛事掘金</h1>
    <p class="subtitle">每日更新 · 发现值得参加的 AI 比赛</p>
    <p class="update-date" id="updateDate"></p>
  </header>
  <nav class="filters">
    <button class="filter-btn active" data-filter="all">全部</button>
    <button class="filter-btn" data-filter="high-prize">🔥 高奖金</button>
    <button class="filter-btn" data-filter="ai-video">🎬 AI 视频</button>
    <button class="filter-btn" data-filter="ai-dev">💻 AI 开发</button>
    <button class="filter-btn" data-filter="ai-agent">🤖 AI Agent</button>
    <button class="filter-btn" data-filter="ai-game">🎮 AI 游戏</button>
  </nav>
  <main class="grid" id="contestGrid"></main>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <img class="modal-poster" id="modalPoster" src="" alt="">
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-info">
        <div class="modal-info-item"><span class="label">奖金</span><span class="value" id="modalPrize"></span></div>
        <div class="modal-info-item"><span class="label">截止日期</span><span class="value" id="modalDeadline"></span></div>
        <div class="modal-info-item"><span class="label">形式</span><span class="value" id="modalFormat"></span></div>
        <div class="modal-info-item"><span class="label">参赛资格</span><span class="value" id="modalTeam"></span></div>
      </div>
      <a class="modal-btn" id="modalLink" href="#" target="_blank">前往官网 →</a>
    </div>
  </div>
  <footer class="footer">
    <p>© 2026 AI 赛事掘金 · 每日自动更新</p>
    <p class="footer-email">联系我们：2319582090z@gmail.com · ZX2319582090@163.com · 2319582090@qq.com</p>
  </footer>
  <script>
    const DATA = {
      "lastUpdated": "2026-05-27",
      "contests": [
        {
          "id": 1, "name": "Berkeley AI Hackathon 2026",
          "prize": "$100,000", "prizeCNY": "约 ¥720,000",
          "deadline": "2026-06-20", "format": "线下",
          "location": "UC Berkeley, 美国", "teamSize": "个人/团队",
          "category": ["high-prize", "ai-dev"],
          "tags": ["高奖金", "AI开发"],
          "url": "https://ai.hackberkeley.org/",
          "description": "24小时AI黑客松，$100K奖金池，300+项目，1300+参赛者。探索LLM和开源API的潜力。"
        },
        {
          "id": 2, "name": "Agentic AI Hackathon - Microsoft",
          "prize": "$55,000", "prizeCNY": "约 ¥396,000",
          "deadline": "2026-06-12", "format": "线上",
          "location": "全球", "teamSize": "个人/团队",
          "category": ["high-prize", "ai-agent"],
          "tags": ["高奖金", "AI Agent"],
          "url": "https://ai-agentic-hackathon.devpost.com/",
          "description": "微软官方AI Agent黑客松，使用GitHub Copilot、M365 Agents Toolkit构建智能代理。"
        },
        {
          "id": 3, "name": "Gemini 3 Hackathon - Google DeepMind",
          "prize": "$100,000", "prizeCNY": "约 ¥720,000",
          "deadline": "2026-07-15", "format": "线上",
          "location": "全球", "teamSize": "个人/团队",
          "category": ["high-prize", "ai-dev"],
          "tags": ["高奖金", "AI开发"],
          "url": "https://gemini3.devpost.com/",
          "description": "Google DeepMind举办的Gemini 3黑客松，$100K奖金+AI Futures Fund面试机会。"
        },
        {
          "id": 4, "name": "Sora AI 短片创作大赛",
          "prize": "¥500,000", "prizeCNY": "¥500,000",
          "deadline": "2026-07-31", "format": "线上",
          "location": "中国", "teamSize": "个人",
          "category": ["ai-video"],
          "tags": ["AI视频"],
          "url": "https://openai.com/sora",
          "description": "使用Sora生成AI短片，主题不限，评审标准：创意、叙事、视觉质量。"
        },
        {
          "id": 5, "name": "Kaggle AI Code Contest",
          "prize": "$50,000", "prizeCNY": "约 ¥360,000",
          "deadline": "2026-08-01", "format": "线上",
          "location": "全球", "teamSize": "个人/团队(≤5人)",
          "category": ["high-prize", "ai-dev"],
          "tags": ["高奖金", "AI开发"],
          "url": "https://www.kaggle.com/competitions",
          "description": "Kaggle官方AI编程挑战赛，解决实际问题，赢取现金奖金。"
        },
        {
          "id": 6, "name": "AI 游戏开发马拉松",
          "prize": "¥200,000", "prizeCNY": "¥200,000",
          "deadline": "2026-06-30", "format": "线上",
          "location": "中国", "teamSize": "个人/团队",
          "category": ["ai-game"],
          "tags": ["AI游戏"],
          "url": "https://itch.io/jams",
          "description": "48小时AI游戏开发挑战，使用AI工具辅助创作完整游戏Demo。"
        }
      ]
    };

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('contestGrid');
      const modal = document.getElementById('modal');
      document.getElementById('updateDate').textContent = '更新于 ' + DATA.lastUpdated;

      function render(filter) {
        const filtered = filter === 'all' ? DATA.contests : DATA.contests.filter(c => c.category.includes(filter));
        if (!filtered.length) { grid.innerHTML = '<div class="empty"><h3>暂无赛事</h3><p>该分类下暂无比赛信息</p></div>'; return; }
        grid.innerHTML = filtered.map(c => {
          const daysLeft = Math.ceil((new Date(c.deadline) - new Date()) / 86400000);
          let dc = 'safe';
          if (daysLeft <= 7) dc = 'soon'; else if (daysLeft <= 21) dc = 'normal';
          const dl = daysLeft <= 0 ? '已截止' : daysLeft <= 1 ? '明天截止！' : daysLeft + ' 天后截止';
          const tags = c.tags.map(t => '<span class="card-tag ' + (t === '高奖金' ? 'hot' : '') + '">' + t + '</span>').join('');
          return '<div class="card" data-id="' + c.id + '">' +
            '<div class="card-poster"></div>' +
            '<div class="card-body"><div class="card-tags">' + tags + '</div>' +
            '<h3 class="card-name">' + c.name + '</h3>' +
            '<div class="card-meta">' +
            '<span class="card-prize">💰 ' + c.prize + '（' + c.prizeCNY + '）</span>' +
            '<span class="card-deadline ' + dc + '">📅 ' + c.deadline + ' · ' + dl + '</span>' +
            '<span>📍 ' + c.format + ' · ' + c.location + '</span>' +
            '<span>👥 ' + c.teamSize + '</span></div></div></div>';
        }).join('');
        grid.querySelectorAll('.card').forEach(card => {
          card.addEventListener('click', () => {
            const c = DATA.contests.find(x => x.id == card.dataset.id);
            document.getElementById('modalPoster').src = '';
            document.getElementById('modalPoster').alt = c.name;
            document.getElementById('modalTitle').textContent = c.name;
            document.getElementById('modalDesc').textContent = c.description;
            document.getElementById('modalPrize').textContent = c.prize + '（' + c.prizeCNY + '）';
            document.getElementById('modalDeadline').textContent = c.deadline;
            document.getElementById('modalFormat').textContent = c.format + ' · ' + c.location;
            document.getElementById('modalTeam').textContent = c.teamSize;
            document.getElementById('modalLink').href = c.url;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
          });
        });
      }

      document.getElementById('modalClose').addEventListener('click', closeModal);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
      function closeModal() { modal.classList.remove('active'); document.body.style.overflow = ''; }

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render(btn.dataset.filter);
        });
      });
      render('all');
    });
  </script>
</body>
</html>
